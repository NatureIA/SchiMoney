name: Automatic SchiMoney deploy

on:
  push:
    branches: [main]

concurrency:
  group: schimoney-production
  cancel-in-progress: false

env:
  WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
  SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
  SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
  SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

jobs:
  build_test_deploy_verify:
    runs-on: windows-latest

    steps:
      - name: Validate deployment configuration
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.WEBSITE_NAME }}")) { throw "WEBSITE_NAME não configurado." }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SERVER_COMPUTER_NAME }}")) { throw "SERVER_COMPUTER_NAME não configurado." }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SERVER_USERNAME }}")) { throw "SERVER_USERNAME não configurado." }
          if ([string]::IsNullOrWhiteSpace("${{ secrets.SERVER_PASSWORD }}")) { throw "SERVER_PASSWORD não configurado." }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/SchiMoney.Web/SchiMoney.Web.csproj

      - name: Build
        run: dotnet build src/SchiMoney.Web/SchiMoney.Web.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/SchiMoney.Web/SchiMoney.Web.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Deploy to MonsterASP
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ env.WEBSITE_NAME }}
          server-computer-name: ${{ env.SERVER_COMPUTER_NAME }}
          server-username: ${{ env.SERVER_USERNAME }}
          server-password: ${{ env.SERVER_PASSWORD }}

      - name: Verify application and database automatically
        shell: pwsh
        run: |
          $healthUrl = "https://schimoney.runasp.net/health"
          $maxAttempts = 24

          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            try {
              Write-Host "Health check HTTPS $attempt/$maxAttempts -> $healthUrl"
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 20 -MaximumRedirection 5
              if ($response.StatusCode -eq 200) {
                $body = $response.Content | ConvertFrom-Json
                if ($body.status -eq "healthy" -and $body.database -eq "connected" -and $body.schema -eq "ready") {
                  Write-Host "SchiMoney publicado com HTTPS válido e banco validado."
                  break
                }
              }
            }
            catch {
              Write-Host "HTTPS ainda indisponível: $($_.Exception.Message)"
            }

            if ($attempt -eq $maxAttempts) {
              throw "SchiMoney foi publicado, mas HTTPS ainda não está válido."
            }

            Start-Sleep -Seconds 10
          }

      - name: Verify PWA assets over HTTPS
        shell: pwsh
        run: |
          $base = "https://schimoney.runasp.net"
          $assets = @(
            "/manifest.webmanifest",
            "/service-worker.js",
            "/icons/icon-192.png",
            "/icons/icon-512.png",
            "/offline.html",
            "/"
          )

          foreach ($asset in $assets) {
            $url = "$base$asset"
            Write-Host "Checking $url"
            $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 20
            if ($response.StatusCode -ne 200) {
              throw "PWA asset indisponível: $url"
            }
          }

          $manifestResponse = Invoke-WebRequest -Uri "$base/manifest.webmanifest" -UseBasicParsing -TimeoutSec 20
          $manifestText = if ($manifestResponse.Content -is [byte[]]) {
            [System.Text.Encoding]::UTF8.GetString($manifestResponse.Content)
          } else {
            [string]$manifestResponse.Content
          }
          $manifestBody = $manifestText | ConvertFrom-Json

          if ($manifestResponse.StatusCode -ne 200) { throw "Manifest não respondeu 200." }
          if ($manifestResponse.Headers["Content-Type"] -notlike "application/manifest+json*") {
            throw "Manifest com MIME incorreto: $($manifestResponse.Headers["Content-Type"])"
          }
          if ($manifestBody.name -ne "SchiMoney") { throw "Manifest sem nome válido." }
          if ($manifestBody.short_name -ne "SchiMoney") { throw "Manifest sem short_name válido." }
          if ($manifestBody.id -ne "/") { throw "Manifest com id inválido." }
          if ($manifestBody.start_url -ne "/") { throw "Manifest com start_url inválido." }
          if ($manifestBody.scope -ne "/") { throw "Manifest com scope inválido." }
          if ($manifestBody.display -ne "standalone") { throw "Manifest sem display standalone." }
          if ($manifestBody.prefer_related_applications -ne $false) { throw "prefer_related_applications inválido." }
          if (-not $manifestBody.icons -or $manifestBody.icons.Count -lt 2) { throw "Manifest sem ícones obrigatórios." }

          $worker = Invoke-WebRequest -Uri "$base/service-worker.js" -UseBasicParsing -TimeoutSec 20
          if ($worker.StatusCode -ne 200) { throw "Service worker indisponível." }

          $loginPage = Invoke-WebRequest -Uri "$base/" -UseBasicParsing -TimeoutSec 20
          $loginText = if ($loginPage.Content -is [byte[]]) {
            [System.Text.Encoding]::UTF8.GetString($loginPage.Content)
          } else {
            [string]$loginPage.Content
          }
          if ($loginPage.StatusCode -ne 200) { throw "Raiz do PWA não respondeu HTTP 200." }
          if ($loginText -notmatch 'rel="manifest" href="/manifest.webmanifest"') {
            throw "Raiz do PWA não referencia manifest.webmanifest."
          }

          Write-Host "PWA validado no padrão ROUTINE: HTTPS, manifest, MIME, start_url, scope, ícones e service worker."
