<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1110" />
    <title>Sem conexão · SchiMoney</title>
    <style>
        *{box-sizing:border-box}
        body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f5f3;color:#111315;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px}
        main{width:min(460px,100%);background:#fff;border:1px solid #e6e9e5;border-radius:22px;padding:30px;box-shadow:0 18px 50px rgba(18,24,21,.06)}
        .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;margin-bottom:28px}
        .mark{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:#148b65;color:#fff}
        h1{font-size:28px;letter-spacing:-.04em;margin:0 0 10px}
        p{color:#737a76;line-height:1.6;font-size:14px;margin:0 0 24px}
        button{width:100%;border:0;border-radius:12px;padding:12px 16px;background:#111513;color:#fff;font:inherit;font-weight:750;cursor:pointer}
    </style>
</head>
<body>
<main>
    <div class="brand"><span class="mark">S</span><span>SchiMoney</span></div>
    <h1>Você está sem conexão.</h1>
    <p>Por segurança, dados financeiros não ficam armazenados offline. Reconecte-se para acessar suas informações atualizadas.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
</main>
</body>
</html>
